# Main nginx configuration of the Docker image (replaces /etc/nginx/nginx.conf; the image's
# conf.d/default.conf is removed in the Dockerfile so this is the only server).
# Serves the Vite build (/usr/share/nginx/html) on port 80 (HTTP) and 443 (HTTPS).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Full MIME map shipped with nginx (.js -> application/javascript, .css, .svg, .json, .wasm...).
    # Module scripts, workers and the AudioWorklet are rejected by the browser without a JavaScript
    # MIME type (and nosniff is on), so never replace this with a bare `types {}` block.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json
                  image/svg+xml application/manifest+json;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # text/html is always compressed when gzip is on (listing it would only cause a warning).
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    256;
    gzip_types         text/css text/javascript application/javascript application/json
                       image/svg+xml text/plain application/manifest+json application/wasm;

    server {
        listen       80 default_server;
        listen       443 ssl default_server;
        server_name  _;

        # Fixed paths: symlinks created at start-up by /docker-entrypoint.d/05-selfsigned-cert.sh
        # (mounted certificate in /etc/nginx/certs, or a generated self-signed one).
        ssl_certificate      /etc/nginx/certs-active/server.crt;
        ssl_certificate_key  /etc/nginx/certs-active/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  1h;
        ssl_session_tickets  off;

        # Plain HTTP sent to the HTTPS port: redirect to https on the same host:port the browser
        # used ($http_host keeps the published port, e.g. 8443, unlike $server_port).
        error_page 497 =301 https://$http_host$request_uri;

        # Relative redirects: the container ports (80/443) differ from the published ones.
        absolute_redirect off;

        root   /usr/share/nginx/html;
        index  index.html;

        # For responses produced by locations without their own add_header (e.g. the 497 redirect).
        include /etc/nginx/snippets/security-headers.conf;

        # The entry page must always be revalidated, so a new build is picked up immediately.
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Vite's content-hashed bundles (JS, CSS, worker and AudioWorklet chunks): cache forever.
        # A missing file must be a 404, never the SPA fallback (HTML served for a .js URL), and
        # the long cache header is sent only on success (no `always`) so a 404 is never cached.
        location ^~ /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Other static files (from Vite's public/ folder): revalidate, and 404 when missing.
        location ~* \.(?:js|mjs|css|map|json|wasm|svg|png|jpe?g|gif|webp|ico|txt|xml|webmanifest|woff2?|ttf|wav)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # SPA fallback: any other path serves index.html (internal redirect to the location above).
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
