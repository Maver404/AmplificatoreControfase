# Pubblica l'app su GitHub Pages a ogni push su main (e a richiesta da Actions).
# Prima volta: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Pages non permette header HTTP personalizzati: CSP e Permissions-Policy di docker/ qui non valgono.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      # Il sito è servito da https://<utente>.github.io/<repo>/: worklet, worker e asset usano questo prefisso.
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
