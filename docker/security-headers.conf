# Security headers, included at server level AND in every location that has its own add_header:
# nginx inherits add_header directives only into blocks that define none themselves.
# `always` also sends them on error responses (404, 403, 5xx).
#
# Content-Security-Policy:
#  - scripts, the AudioWorklet module (governed by script-src) and Web Workers are same-origin
#    files emitted by Vite in /assets: no inline script, no eval, no blob: code;
#  - style-src allows inline styles because UI components may set style attributes from
#    templates; scripts stay locked to 'self';
#  - data:/blob: images and fonts cover assets Vite inlines and canvas snapshots;
#  - no upgrade-insecure-requests: the app is also served over plain http://localhost:8080.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Microphone only for this origin; nothing else the app does not need.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# No SharedArrayBuffer is used, so no COEP; COOP/CORP only isolate the page from other origins.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
